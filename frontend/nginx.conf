server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker Compose's embedded DNS — resolved per-request (via the $backend_upstream
    # variable below) rather than once at nginx startup, so this container can
    # start even if the backend isn't up yet.
    resolver 127.0.0.11 valid=10s;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Long-cache hashed build assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # robots.txt / sitemap.xml are generated dynamically by the backend
    # (the sitemap needs to list every product page) — proxied here so
    # crawlers hitting the storefront domain get them, as expected.
    # If you're not using the shipped docker-compose setup, point these at
    # your backend's real URL instead of the "backend" service name.
    location = /robots.txt {
        set $backend_upstream backend:5000;
        proxy_pass http://$backend_upstream/robots.txt;
    }
    location = /sitemap.xml {
        set $backend_upstream backend:5000;
        proxy_pass http://$backend_upstream/sitemap.xml;
    }

    # React Router: fall back to index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location = /healthz {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
