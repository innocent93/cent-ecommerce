name: ecommerce

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    # MongoDB transactions (used by order.service.js to make checkout —
    # stock reservation + order creation + coupon redemption — a single
    # atomic commit) require a replica set, even a single-node one. A
    # standalone mongod (the old config) cannot run transactions at all.
    # MongoDB Atlas runs as a replica set by default, so this only matters
    # for local/self-hosted Mongo.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    environment:
      MONGO_INITDB_DATABASE: ecommerce
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [ecommerce_net]

  # One-shot job: initializes the single-node replica set on first startup,
  # then exits. Safe to re-run (checks rs.status() first) — restarts of the
  # stack after the first one just no-op here.
  mongo-init:
    image: mongo:7
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
    networks: [ecommerce_net]
    entrypoint: >
      mongosh --host mongo:27017 --eval "
      try { rs.status(); print('replica set already initialized'); }
      catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }); print('replica set initiated'); }
      "

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [ecommerce_net]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Overrides .env so the API always talks to the compose-managed
      # mongo/redis services regardless of what's in the local .env file.
      MONGO_URI: mongodb://mongo:27017/ecommerce?replicaSet=rs0
      REDIS_URL: redis://redis:6379
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5000/healthz', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [ecommerce_net]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:5000}
    restart: unless-stopped
    ports:
      - "5173:8080"
    depends_on:
      - backend
    networks: [ecommerce_net]

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:5000}
    restart: unless-stopped
    ports:
      - "5174:8080"
    depends_on:
      - backend
    networks: [ecommerce_net]

  seller:
    build:
      context: ./seller
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:5000}
    restart: unless-stopped
    ports:
      - "5175:8080"
    depends_on:
      - backend
    networks: [ecommerce_net]

networks:
  ecommerce_net:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
